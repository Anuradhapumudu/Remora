[package]
name = "remora-host"
description = "Remora host: shares this computer's screen with an approved viewer."
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[dependencies]
remora-app = { workspace = true }
remora-crypto = { workspace = true }
remora-net = { workspace = true }
remora-proto = { workspace = true }
remora-session = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# The Phase 4.5 GUI: the screens (remora-ui, D45) and Slint's runtime API.
remora-ui = { workspace = true }
slint = { workspace = true }
remora-capture = { workspace = true }
remora-codec = { workspace = true }
objc2-foundation = { workspace = true, features = ["NSProcessInfo"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Drives the GUI from Rust tests (D-4, phase4.5-criteria §5).
i-slint-backend-testing = { workspace = true }

[dev-dependencies]
rand_core = { workspace = true }

[lints]
workspace = true
