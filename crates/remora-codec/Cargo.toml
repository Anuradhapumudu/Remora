[package]
name = "remora-codec"
description = "Remora video codecs: hardware-first encoder and decoder backends with a software fallback."
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
remora-capture = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { workspace = true, features = ["CFArray", "CFDictionary", "CFNumber", "CFString", "CFBase"] }
objc2-video-toolbox = { workspace = true, features = [
    "VTBase", "VTCompressionProperties", "VTCompressionSession", "VTErrors", "VTSession",
    "VTVideoEncoderList", "objc2-core-media", "objc2-core-video",
] }
objc2-core-media = { workspace = true, features = ["CMSampleBuffer", "CMBlockBuffer", "CMFormatDescription", "CMTime", "CMBase", "objc2-core-video"] }
objc2-core-video = { workspace = true, features = ["CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferPool", "CVReturn", "CVBase"] }

[lints]
workspace = true
