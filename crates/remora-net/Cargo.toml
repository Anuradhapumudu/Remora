[package]
name = "remora-net"
description = "Remora networking: single-socket STUN/ICE/QUIC transport with NAT traversal."
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
remora-crypto = { workspace = true }
remora-proto = { workspace = true }
remora-session = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "net"] }
rand_core = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }

[features]
# Records every media datagram handed to quinn (phase4-criteria M1a). Only
# this crate's own tests turn it on (the dev-dependency on itself below);
# it sees sealed bytes only, never plaintext.
test-tap = []

[dev-dependencies]
remora-net = { path = ".", features = ["test-tap"] }
remora-testkit = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
prost = { workspace = true }

[lints]
workspace = true
