# THROWAWAY (Phase 2.5): runs the Windows capture/input spike on GitHub's Windows
# runner and keeps its report. Delete together with spikes/windows-spike.
name: Windows spike

on:
  workflow_dispatch: # run manually: Actions → Windows spike → Run workflow

permissions:
  contents: read

jobs:
  spike:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Build spike
        run: cargo build --release --locked -p windows-spike
      - name: Run spike (the report is the result; it always exits 0)
        shell: pwsh
        run: |
          ./target/release/windows-spike.exe | Tee-Object -FilePath spike-report.txt
          "--- runner context ---" | Add-Content spike-report.txt
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion | Out-String | Add-Content spike-report.txt
          query session 2>&1 | Out-String | Add-Content spike-report.txt
          # `query session` exits 1 on success here; the report is the result.
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-spike-report
          path: spike-report.txt
