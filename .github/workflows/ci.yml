# Runs on every push and pull request: formatting, lints, tests and supply-chain
# checks on all three desktop OSes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux uses the oldest Ubuntu we support, same as the release build.
        os: [ubuntu-22.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the compiler; this installs exactly that version.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny,cargo-audit

      - name: cargo deny
        run: cargo deny --locked check

      - name: cargo audit
        run: cargo audit

  # docs/dependencies.md rule 1, enforced (cargo-deny cannot express it):
  # every crates.io package newly locked by this change must be >= 14 days
  # old. Fails closed if crates.io cannot be reached.
  crate-age:
    name: dependency release age (>= 14 days)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Self-test (planted too-new entries must be caught)
        run: python3 -I scripts/ci/check-crate-age.py --self-test
      - name: Check newly locked crates
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base=$(git merge-base HEAD "origin/$BASE_REF")
          elif [ "$EVENT" = "push" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base=""
          fi
          if [ -n "$base" ]; then
            python3 -I scripts/ci/check-crate-age.py --base "$base" Cargo.lock fuzz/Cargo.lock
          else
            python3 -I scripts/ci/check-crate-age.py --all Cargo.lock fuzz/Cargo.lock
          fi

  # The A04 timing claim rests ONLY on the 200-sample "A04 timing" workflow
  # (phase3-criteria §3.1a); the 3-sample run inside the mutation gate checks
  # the floor exists but proves nothing statistical. If the 200-sample job
  # is skipped, disabled or broken, everything else stays green - so this
  # job turns CI red when that workflow has no successful run in 48 hours.
  a04-evidence-fresh:
    name: A04 timing evidence is fresh (< 48 h)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Latest successful 200-sample A04 run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          last=$(gh run list --repo "$REPO" --workflow timing.yml --status success --limit 1 --json createdAt --jq '.[0].createdAt // empty')
          if [ -z "$last" ]; then
            echo "::error::no successful A04 timing run at all"
            exit 1
          fi
          age_h=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 3600 ))
          echo "last successful A04 timing run: $last ($age_h h ago)"
          if [ "$age_h" -ge 48 ]; then
            echo "::error::A04 timing evidence is $age_h h old (>= 48 h): the statistical job is not running"
            exit 1
          fi
