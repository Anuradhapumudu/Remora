# phase3-criteria A04 timing, at the criteria's sample size: 200 handshakes
# per failure type per step, every AUTH_FAILED in [200, 225] ms, medians
# within a step < 1 ms apart, A/A control first ("too noisy to judge" is
# reported as a failure, never as a pass). Release build, one test binary.
name: A04 timing

on:
  schedule:
    - cron: "53 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/remora-net/**"
      - "crates/remora-session/**"
      - "crates/remora-crypto/**"

permissions:
  contents: read

jobs:
  a04:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: A04 timing (200 samples per type)
        env:
          A04_SAMPLES: "200"
        run: cargo test --release --locked -p remora-net --test a04_timing -- --nocapture
